<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同程旅行 - 返货余额监控仪表盘</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>📊 同程旅行 - 返货余额监控仪表盘</h1>
  <div class="subtitle">
    返货消耗 = 「账户消耗-普通返货」日均（为0时展示0，转入计算按日均消耗×10%估算） &nbsp;|&nbsp; 安全阈值：可支撑 ≥ <span id="targetDaysLabel" style="font-weight:700;color:var(--primary)">10</span> 天
    &nbsp;|&nbsp; 数据日期: <span id="reportDate">--</span>
    &nbsp;|&nbsp; 统计范围: <span id="dateRange">--</span>
  </div>
</div>

<div class="container">

  <div class="summary-row" id="summaryRow"></div>
  <div class="transfer-summary" id="transferSummary"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">📋 全部账户<span class="tab-count" id="countAll"></span></button>
    <button class="tab-btn" data-tab="insufficient" onclick="switchTab('insufficient')">📥 需转入<span class="tab-count" id="countIn"></span></button>
    <button class="tab-btn" data-tab="sufficient" onclick="switchTab('sufficient')">📤 可转出<span class="tab-count" id="countOut"></span></button>
    <button class="tab-btn" data-tab="idle" onclick="switchTab('idle')">💤 闲置余额<span class="tab-count" id="countIdle"></span></button>
  </div>

  <div class="toolbar">
    <div class="target-days" title="目标可支撑天数：转入/转出金额按此天数计算，修改后自动重算">
      <label for="targetDaysInput">🎯 调拨天数</label>
      <input type="number" id="targetDaysInput" min="1" max="60" step="1" value="10" onchange="updateTargetDays()">
      <span class="unit">天</span>
    </div>
    <input type="text" id="searchInput" placeholder="🔍 搜索账户名称 / ID / 代理商..." oninput="renderTable()">
    <button class="btn btn-outline btn-upload">
      📂 加载新报表
      <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="loadNewFile(event)">
    </button>
    <button class="btn btn-outline" onclick="exportCSV()">📥 导出 CSV</button>
    <span class="stats-text" id="tableStats"></span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="chart-section">
    <div class="chart-card">
      <h3>📈 可支撑天数分布</h3>
      <div class="chart-wrap"><canvas id="daysChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>💰 资金调拨概览（转入/转出 Top 10）</h3>
      <div class="chart-wrap"><canvas id="transferChart"></canvas></div>
    </div>
  </div>

  <div class="footer">
    返货余额监控工具 v2.1 &nbsp;|&nbsp; 返货余额可在账户间转入/转出，需人工操作 &nbsp;|&nbsp; 建议每 <span id="targetDaysFooter" style="font-weight:700">10</span> 天至少调拨一次
    &nbsp;|&nbsp; <span style="color:var(--red);font-weight:600;">⚠️ account_data.json 含敏感财务数据，请勿外传</span>
  </div>
</div>


<script src="chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
