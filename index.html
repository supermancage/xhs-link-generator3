<body data-page-node-id="vb5kkHyhFBBCFHHfTVZxmV">
  <div class="app" data-page-node-id="CCQYSZZfypmTtFHCqzgcJv">

    <!-- 顶部 Header -->
    <header class="app-header" data-page-node-id="p9uEimkmxQ7Fsyab0R8axK">
      <div class="header-inner" data-page-node-id="CBtvV7aZ7jFWaxJYAw8UNq">
        <h1 class="app-title" data-page-node-id="tN2NZAANjrgvjaKgRSnVLK">小红书<span class="accent" data-page-node-id="4ZO0DeCEV8oWNkSBihfLHk">投放工具箱</span></h1>
        <p class="app-subtitle" data-page-node-id="gcQVHGwTKaaESQ8JhemUvG">关键词分类 · 链接生成 · 返货监控 — 一站式投放效率工具</p>

      <!-- 左侧竖向导航（可折叠） -->
      <aside class="sidebar" id="app-sidebar" data-page-node-id="GMH0bbkcg8FSXYIRpf2GlZ">

          </button>
          <button type="button" class="tab-btn" id="tab-generator" role="tab"
                  aria-controls="tool-panel" aria-selected="false" data-tool="generator"

        <iframe id="tool-frame" class="tool-frame"

                src="keyword-classifier/index.html" data-page-node-id="YpT41AHqCu5JRagXidsiRn"></iframe>

  <script>
    (function () {
      'use strict';

      /**
       * URL hash 路由：切换 Tab 更新 hash，刷新后保持上次选中的工具。
       *   #classifier -> keyword-classifier/index.html
       *   #generator  -> xhs-link-generator3/index.html
       *   #rebate     -> rebate-monitor/index.html
       */
      var TOOLS = {
        classifier: 'keyword-classifier/index.html',
        generator: 'xhs-link-generator3/index.html',
        rebate: 'rebate-monitor/index.html'
      };
      var DEFAULT_TOOL = 'classifier';

      /** 侧边栏折叠状态持久化键名：值为 '1' 表示收起，'0' 表示展开。 */
      var SIDEBAR_STATE_KEY = 'sidebarCollapsed';
      /** 窄屏断点（与 css/style.css 的 768px media query 保持一致）。 */
      var NARROW_BREAKPOINT = 768;

      var frame = document.getElementById('tool-frame');
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
      var sidebar = document.getElementById('app-sidebar');
      var toggleBtn = document.getElementById('sidebar-toggle');

      /** 从当前 URL hash 解析工具名，非法或缺失时回退到默认工具。 */
      function parseTool() {
        var hash = window.location.hash.replace(/^#\/?/, '');
        return Object.prototype.hasOwnProperty.call(TOOLS, hash) ? hash : DEFAULT_TOOL;
      }

      /** 激活指定工具：更新 Tab 激活态 + 切换 iframe 地址（src 未变化时不重载）。 */
      function activate(tool) {
        var src = TOOLS[tool];
        if (!src) {
          return;
        }
        tabs.forEach(function (btn) {
          var isActive = btn.getAttribute('data-tool') === tool;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        if (frame.getAttribute('src') !== src) {
          frame.src = src;
        }
      }

      /** 将工具名同步写入 URL hash（值不变时不写入，避免无谓的 hashchange）。 */
      function syncHash(tool) {
        var target = '#' + tool;
        if (window.location.hash !== target) {
          window.location.hash = target;
        }
      }

      /** 读取折叠状态：优先取 localStorage，无记录时窄屏默认收起、宽屏默认展开。 */
      function readCollapsed() {
        var raw = null;
        try {
          raw = window.localStorage.getItem(SIDEBAR_STATE_KEY);
        } catch (err) {
          raw = null; // localStorage 不可用（隐私模式等）时退化为按视口宽度决定
        }
        if (raw === '1') {
          return true;
        }
        if (raw === '0') {
          return false;
        }
        return window.innerWidth <= NARROW_BREAKPOINT;
      }

      /** 应用折叠状态：切换样式 class、更新按钮文案与无障碍属性；persist 为真时写入 localStorage。 */
      function applyCollapsed(collapsed, persist) {
        sidebar.classList.toggle('collapsed', collapsed);
        toggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        toggleBtn.textContent = collapsed ? '»' : '«';
        toggleBtn.title = collapsed ? '展开侧边栏' : '收起侧边栏';
        if (persist) {
          try {
            window.localStorage.setItem(SIDEBAR_STATE_KEY, collapsed ? '1' : '0');
          } catch (err) {
            // 写入失败不影响交互，仅失去刷新后记忆能力
          }
        }
      }

      // Tab 点击：激活工具 + 更新 hash（hash 变化会再次触发 activate，幂等无害）
      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var tool = btn.getAttribute('data-tool');
          if (tool && Object.prototype.hasOwnProperty.call(TOOLS, tool)) {
            activate(tool);
            syncHash(tool);
          }
        });
      });

      // 折叠按钮点击：在展开/收起间切换并持久化
      toggleBtn.addEventListener('click', function () {
        applyCollapsed(!sidebar.classList.contains('collapsed'), true);
      });

      // hashchange：支持浏览器前进/后退、手动改 hash；非法 hash 立即归一化 URL
      window.addEventListener('hashchange', function () {
        var tool = parseTool();
        activate(tool);
        if (window.location.hash !== '#' + tool) {
          history.replaceState(null, '', '#' + tool);
        }
      });

      // 初始化：无 hash 或 hash 非法时，用 replaceState 归一化到当前工具
      // （不产生多余历史记录），随后激活对应工具；刷新页面保持上次选中。
      var initial = parseTool();
      if (window.location.hash !== '#' + initial) {
        history.replaceState(null, '', '#' + initial);
      }
      activate(initial);

      // 初始化：恢复上次记录的折叠状态（不回写 localStorage，避免覆盖既有偏好）
      applyCollapsed(readCollapsed(), false);
    })();
  </script>
</body>
